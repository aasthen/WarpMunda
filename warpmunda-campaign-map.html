<style id="app-css">
/* Layout: map plate first (the record), details beside it on wide screens, below it on phones; gangs and the area list follow. */
:root {
  --bg: #13110e;
  --panel: #1c1915;
  --plate: #2a2620;
  --line: #3a342b;
  --ink: #ece4d2;
  --muted: #a3998a;
  --rust: #b4532d;
  --hazard: #e6b23a;
  --display: "Saira Stencil One", Impact, "Arial Black", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 20px; }

header.top { display: grid; gap: 6px; }
.eyebrow { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--rust); margin: 0; }
.title-input { font-family: var(--display); font-size: clamp(28px, 6vw, 44px); line-height: 1.05; background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 2px 0; width: 100%; letter-spacing: .01em; }
.title-input:hover { border-bottom-color: var(--line); }
.title-input:focus { border-bottom-color: var(--hazard); outline: none; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }

.savebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 4px; font-size: 15px; }
.savebar.is-dirty { border-left-color: var(--hazard); }
.savebar.is-ok { border-left-color: #5c8f55; }
.savebar .msg { flex: 1 1 220px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--plate); padding: 8px 14px; border-radius: 3px; cursor: pointer; font-family: var(--cond); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 15px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--hazard); color: #1a1408; border-color: var(--hazard); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--rust); color: #f0b9a3; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
.lower { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .main, .lower { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; min-width: 0; }
.panel h2.ph { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }

.mapcard { padding: 10px; }
.mapcard svg { display: block; width: 100%; height: auto; }
.cell { cursor: pointer; }
.cell:focus { outline: none; }
.cell:focus-visible .cell-sel { stroke: var(--hazard); stroke-width: 5; }
.cell-hl { transition: fill-opacity .15s; }
.cell:hover .cell-hl { fill-opacity: .1; }
.maptext { font-family: var(--cond); font-weight: 700; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: rgba(10, 8, 6, .75); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 6px 4px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; border: 1px solid rgba(0,0,0,.4); }
.dot.unclaimed { background: #3a3128; border-color: #5a4d3e; }
.dot.start { background: var(--ink); transform: rotate(45deg) scale(.8); border-radius: 1px; }

.detail .area-meta { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--rust); margin: 0; }
.detail h2.terr { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; }
.detail .place { margin: 0 0 14px; color: var(--muted); }
.income { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; background: var(--plate); border-radius: 3px; margin-bottom: 14px; }
.income strong { font-family: var(--cond); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1; }
.income span { color: var(--muted); font-size: 14px; }
.detail h3 { font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; margin: 14px 0 6px; color: var(--hazard); }
.detail h3 small { color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: 13px; }
.detail ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.detail p { margin: 0; }
.field { display: grid; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.field label { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
select, .text-input { background: var(--plate); border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px; width: 100%; min-width: 0; }
select:focus, .text-input:focus { border-color: var(--hazard); outline: none; }

.gang-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gang-row:last-of-type { border-bottom: 0; }
.swatch { width: 30px; height: 30px; border-radius: 3px; border: 2px solid rgba(0,0,0,.35); cursor: pointer; padding: 0; }
.gang-name { font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1.15; overflow-wrap: anywhere; }
.gang-who { grid-column: 2 / 3; font-size: 14px; color: var(--ink); opacity: .8; margin-top: -2px; }
.gang-stats { grid-column: 2 / 3; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gang-stats b { color: var(--ink); font-weight: 600; }
.gang-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.unclaimed-line { font-size: 14px; color: var(--muted); margin-top: 10px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #24201a; }
tbody tr.is-sel { background: #2e2818; box-shadow: inset 3px 0 0 var(--hazard); }
.badge { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 50%; background: var(--hazard); color: #1a1408; font-family: var(--cond); font-weight: 700; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.table-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.table-head h2.ph { margin: 0; }
.terr-name { display: flex; align-items: flex-start; gap: 8px; }
.terr-name .ticon { color: var(--hazard); flex: none; margin-top: 1px; }
.detail h2.terr { display: flex; align-items: center; gap: 10px; }
.detail h2.terr .ticon { color: var(--hazard); flex: none; }
.terr-cell { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.info-btn { appearance: none; flex: none; width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--plate); color: var(--hazard); cursor: pointer; padding: 0; }
.info-btn:hover { border-color: var(--hazard); }
.info-btn[aria-expanded="true"] { background: var(--hazard); border-color: var(--hazard); color: #1a1408; }
tbody tr.is-open td { border-bottom-color: transparent; }
tbody tr.info-row { cursor: default; }
tbody tr.info-row:hover { background: transparent; }
.info-row td { padding: 0 8px 14px 50px; }
.desc { background: var(--plate); border-left: 3px solid var(--hazard); border-radius: 3px; padding: 10px 14px 12px; display: grid; gap: 6px; font-size: 15px; max-width: 62ch; }
.desc h4 { margin: 4px 0 0; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--hazard); }
.desc h4 small { color: var(--muted); font-weight: 500; letter-spacing: .03em; text-transform: none; font-size: 12px; }
.desc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.desc p { margin: 0; }
.cite { color: var(--muted); font-size: 13px; margin-top: 10px !important; }
@media (max-width: 480px) { .info-row td { padding-left: 8px; } }
.muted { color: var(--muted); }

.setup p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.confirm { margin-top: 12px; padding: 12px; border: 1px solid var(--rust); border-radius: 3px; background: #241812; display: grid; gap: 10px; }
.confirm .row { display: flex; flex-wrap: wrap; gap: 8px; }
.reports .tablewrap { margin-top: 4px; }
.rtable td { vertical-align: top; }
.rtable td.nowrap { white-space: nowrap; }
.rtable tbody tr { cursor: default; }
.rtable tbody tr:hover { background: transparent; }
.chip.strong { font-weight: 700; }
.crown { color: var(--hazard); flex: none; }
.draw-tag { margin-left: 8px; font-size: 13px; color: var(--muted); }
.linkish { appearance: none; background: none; border: 0; padding: 0; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--hazard); }
.linkish .ticon { color: var(--hazard); flex: none; }
.actions { text-align: right; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row.tight { gap: 6px; justify-content: flex-end; }
.report-form { background: #221e18; border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-bottom: 14px; display: grid; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.ffield { display: grid; gap: 6px; min-width: 0; }
.ffield.full { grid-column: 1 / -1; }
.ffield label { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ffield.check { display: flex; align-items: center; gap: 10px; }
.ffield.check label { font-family: var(--body); font-weight: 400; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.ffield.check input { width: 20px; height: 20px; accent-color: var(--hazard); }
.form-error { margin: 0; color: #f0b9a3; }
.story-btn { display: inline-flex; align-items: center; gap: 6px; }
.story-btn.has-story .ticon { color: var(--hazard); }
.story-btn[aria-expanded="true"] { border-color: var(--hazard); }
.rtable tr.story-row td { padding: 0 8px 16px; }
.story { background: #241f17; border-left: 3px solid var(--hazard); border-radius: 3px; padding: 12px 16px 14px; display: grid; gap: 10px; max-width: 72ch; }
.story h4 { margin: 0; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--hazard); }
.story p { margin: 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 16px; line-height: 1.6; }
.story-input { min-height: 180px; resize: vertical; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 16px; line-height: 1.55; }
.story-msg { margin: 0; font-size: 14px; }
.battle-mini { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
input[type="date"], input[type="number"] { color-scheme: dark; }
@media (max-width: 720px) {
  .rtable thead { display: none; }
  .rtable, .rtable tbody { display: block; }
  .rtable tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rtable td { border: 0; padding: 0; }
  .rtable td::before { content: attr(data-label); display: block; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .rtable td.actions::before { content: none; }
  .rtable td.full-sm, .rtable td.actions { grid-column: 1 / -1; }
  .rtable td.num { text-align: left; }
  .rtable td.actions { text-align: left; }
  .rtable tr.story-row { display: block; padding: 0 0 14px; border-bottom: 1px solid var(--line); }
  .rtable tr.story-row td { display: block; padding: 0; }
  .rtable tr.story-row td::before { content: none; }
  .rtable tr.is-open { border-bottom: 0; }
  .row.tight { justify-content: flex-start; }
}
@media (max-width: 520px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

  function pathD(pts) { return 'M' + pts.map(function (p) { return p[0] + ' ' + p[1]; }).join('L') + 'Z'; }
  function gangById(id) { for (var i = 0; i < state.gangs.length; i++) if (state.gangs[i].id === id) return state.gangs[i]; return null; }
  function areaByN(n) { for (var i = 0; i < state.areas.length; i++) if (state.areas[i].n === n) return state.areas[i]; return null; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function splitName(name) {
    var words = name.split(' ');
    if (name.length <= 9 || words.length < 2) return [name];

    for (var i = 1; i < words.length; i++) {
      var a = words.slice(0, i).join(' ').length, b = words.slice(i).join(' ').length;

  // ---------- saving ----------
  function changed(opts) {

    message = '';
    lsSet({ baseRev: saved.rev, state: state });

  }
  function buildDoc(s) {
    var css = document.getElementById('app-css').textContent;
    var js = document.getElementById('app-js').textContent;
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>WarpMunda Campaign Map</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Saira+Stencil+One&display=swap" rel="stylesheet">\n' +
      '<style id="app-css">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +

  }
  function save() {
    if (!artifactNS || saving || readOnly) return;

    var next = clone(state); next.rev = (saved.rev || 0) + 1;
    Promise.resolve().then(function () { return artifactNS.publish(buildDoc(next)); }).then(function () {
      lsDel(); dirty = false; saving = false; message = 'Saved for everyone who opens this map.'; renderSaveBar();
    }, function (err) {
      saving = false;
      var code = String((err && (err.code || err.name || err.message)) || err);
      if (/conflict/i.test(code)) message = 'Someone else saved first. The page will reload with their version.';
      else if (/not_granted|not_writer/i.test(code)) { readOnly = true; message = 'You can view this map but can’t save it for everyone. Your changes stay in this browser.'; }
      else message = 'Couldn’t save (' + code + '). Your changes are still here; try again.';
      renderSaveBar();
    });
  }
  function discard() {
    state = clone(saved); dirty = false; message = 'Changes discarded.'; lsDel(); render();
  }
  function initCapability(tries) {

      Promise.resolve(window.claude.use('artifact')).then(function (ns) { artifactNS = ns || null; renderSaveBar(); }, function () { artifactNS = null; renderSaveBar(); });
      Promise.resolve(window.claude.use('sample')).then(function (ns) { sampleNS = ns || null; renderReports(); }, function () { sampleNS = null; renderReports(); });
    } else if (tries < 12) {
      setTimeout(function () { initCapability(tries + 1); }, 250);
    } else { artifactNS = null; sampleNS = null; renderSaveBar(); renderReports(); }
  }

  // ---------- rendering ----------
  var app = document.getElementById('app');
  var refs = {};

      el('p', { class: 'eyebrow', text: 'Necromunda · Campaign map' }),

  function renderSaveBar() {
    var bar = refs.savebar; bar.textContent = '';
    var msgText, cls = '';
    var localOnly = artifactNS === null || readOnly;
    if (message) msgText = message;
    else if (localOnly) msgText = dirty ? 'Changes are kept in this browser only. Other players won’t see them.' : 'This map is read-only here. Changes you make stay in this browser.';
    else if (artifactNS === undefined) msgText = dirty ? 'Unsaved changes.' : '';
    else msgText = dirty ? 'Unsaved changes. Save to update the map for everyone.' : '';
    if (!msgText) { bar.className = 'savebar hidden'; return; }
    if (dirty && !localOnly) cls = 'is-dirty';
    else if (!dirty && artifactNS && !readOnly) cls = 'is-ok';

  // width of a cell at height y, measured symmetrically around the label centre
  function spanAt(poly, y, cx) {
    var xs = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      if ((p[1] <= y && q[1] > y) || (q[1] <= y && p[1] > y)) xs.push(p[0] + (y - p[1]) / (q[1] - p[1]) * (q[0] - p[0]));
    }
    if (xs.length < 2) return 0;
    var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
    return 2 * Math.min(cx - lo, hi - cx);
  }
  // highest point of a cell's wall directly above x
  function topAt(poly, x0) {
    var ys = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      if ((p[0] <= x0 && q[0] > x0) || (q[0] <= x0 && p[0] > x0)) ys.push(p[1] + (x0 - p[0]) / (q[0] - p[0]) * (q[1] - p[1]));
    }
    return ys.length ? Math.min.apply(null, ys) : 0;
  }
  // shrink any label that would spill past its cell walls (works with whichever font loaded)
  function fitLabels(svg) {
    svg.querySelectorAll('text.fit').forEach(function (t) {
      var poly = GEO[+t.getAttribute('data-cell')].p;
      var fs = +t.getAttribute('data-fs'), x = +t.getAttribute('x'), y = +t.getAttribute('y');
      t.setAttribute('font-size', String(fs));
      var avail = Math.min(spanAt(poly, y - fs * 0.7, x), spanAt(poly, y, x)) - 20;
      var w = 0;
      try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
      if (avail > 0 && w > avail) t.setAttribute('font-size', Math.max(11, fs * avail / w).toFixed(1));
    });
  }

  function renderMap() {

      var cx = g.c[0], cy = g.c[1];

      var ix = mx + 34 + gap + 21;
      grp.appendChild(sv('circle', { cx: ix, cy: my, r: '20', fill: '#0c0a08', 'fill-opacity': '0.82', stroke: '#ece4d2', 'stroke-opacity': '0.55', 'stroke-width': '1.5' }));

    svg.appendChild(sv('path', { d: pathD(OUTLINE), fill: 'none', stroke: '#b4532d', 'stroke-width': '6', 'stroke-linejoin': 'round', 'pointer-events': 'none' }));
    if (selGroup) {

    if (state.areas.some(function (a) { return a.start; })) lg.appendChild(el('span', null, [el('i', { class: 'dot start' }), 'Starting territory']));
  }

  function nextFreeColor(current) {

      var c = PALETTE[(start + k + PALETTE.length) % PALETTE.length];

  }

      el('h4', null, ['Battlefield effect ', el('small', { text: '(when this is the Stake)' })]),
      el('p', null, [el('strong', { text: t.effect[0] + '. ' }), t.effect[1]]),
      el('p', { class: 'cite', text: 'Core Rulebook p. ' + t.page })
    ]);
  }

  // ---------- battle reports ----------
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : (iso || '');
  }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function winnerOf(b) { return b.result === 'attacker' ? b.attacker : b.result === 'defender' ? b.defender : null; }
  function gangName(id) { var g = gangById(id); return g ? g.name : 'Unknown gang'; }
  function battleLine(b) {
    var w = winnerOf(b);
    if (!w) return gangName(b.attacker) + ' drew with ' + gangName(b.defender);
    var l = w === b.attacker ? b.defender : b.attacker;
    return gangName(w) + ' beat ' + gangName(l);
  }
  function battlesSorted() {
    return (state.battles || []).slice().sort(function (x, y) {
      return (y.date || '').localeCompare(x.date || '') || (y.cycle || 0) - (x.cycle || 0) || String(y.id).localeCompare(String(x.id));
    });
  }
  function recordSpan(g) {
    var w = 0, l = 0, d = 0;
    (state.battles || []).forEach(function (b) {
      if (b.attacker !== g.id && b.defender !== g.id) return;
      var win = winnerOf(b);
      if (!win) d++; else if (win === g.id) w++; else l++;
    });
    if (!w && !l && !d) return null;
    var kids = [el('b', { text: String(w) }), ' won \u00b7 ', el('b', { text: String(l) }), ' lost'];
    if (d) kids.push(' \u00b7 ', el('b', { text: String(d) }), ' drawn');
    return el('span', null, kids);
  }
  function crownIcon() {
    return sv('svg', { viewBox: '0 0 24 24', width: '18', height: '18', class: 'crown', role: 'img', 'aria-label': 'Winner' }, [
      sv('title', { text: 'Winner' }),
      sv('path', { d: 'M3 8.5l4.6 3.8L12 5l4.4 7.3L21 8.5 19.2 18H4.8z', fill: 'currentColor', stroke: '#0c0a08', 'stroke-width': '1.2', 'stroke-linejoin': 'round' }),
      sv('rect', { x: '4.8', y: '19.2', width: '14.4', height: '2.3', rx: '0.8', fill: 'currentColor' })
    ]);
  }
  function gangChip(id, strong, crown) {
    var g = gangById(id);
    var dot = el('i', { class: 'dot' }); if (g) dot.style.background = g.color;
    return el('span', { class: 'chip' + (strong ? ' strong' : '') }, [dot, crown ? crownIcon() : null, g ? g.name : 'Unknown gang']);
  }
  function newDraft() {
    var maxCycle = (state.battles || []).reduce(function (m, b) { return Math.max(m, +b.cycle || 0); }, 0) || 1;
    return { date: todayISO(), cycle: String(maxCycle), area: String(selected), attacker: state.gangs[0].id, defender: state.gangs[1] ? state.gangs[1].id : state.gangs[0].id, result: 'attacker', claim: true };
  }
  function field(label, id, control, full) {
    return el('div', { class: 'ffield' + (full ? ' full' : '') }, [el('label', { for: id, text: label }), control]);
  }
  function gangSelect(id, value, onchange) {
    var sel = el('select', { id: id });
    state.gangs.forEach(function (g) { sel.appendChild(el('option', { value: g.id, text: g.name })); });
    sel.value = value; sel.addEventListener('change', function () { onchange(sel.value); });
    return sel;
  }
  function buildForm() {
    var f = formDraft;
    var form = el('form', { class: 'report-form', novalidate: 'novalidate' });
    var date = el('input', { id: 'br-date', class: 'text-input', type: 'date' }); date.value = f.date;
    date.addEventListener('input', function () { f.date = date.value; });
    var cycle = el('input', { id: 'br-cycle', class: 'text-input', type: 'number', min: '1', max: '20', inputmode: 'numeric' }); cycle.value = f.cycle;
    cycle.addEventListener('input', function () { f.cycle = cycle.value; });
    var area = el('select', { id: 'br-area' });
    state.areas.forEach(function (a) { area.appendChild(el('option', { value: String(a.n), text: '#' + a.n + ' ' + a.type + (gangById(a.owner) ? ' (' + gangName(a.owner) + ')' : '') })); });
    area.value = f.area; area.addEventListener('change', function () { f.area = area.value; });
    var att = gangSelect('br-att', f.attacker, function (v) { f.attacker = v; });
    var def = gangSelect('br-def', f.defender, function (v) { f.defender = v; });
    var res = el('select', { id: 'br-result' }, [
      el('option', { value: 'attacker', text: 'Attacker won' }), el('option', { value: 'defender', text: 'Defender won' }), el('option', { value: 'draw', text: 'Draw' })
    ]);
    res.value = f.result;
    var claim = el('input', { id: 'br-claim', type: 'checkbox' }); claim.checked = f.claim && f.result !== 'draw'; claim.disabled = f.result === 'draw';
    claim.addEventListener('change', function () { f.claim = claim.checked; });
    res.addEventListener('change', function () { f.result = res.value; claim.disabled = res.value === 'draw'; claim.checked = res.value !== 'draw' && f.claim; });
    form.appendChild(el('div', { class: 'form-grid' }, [
      field('Date', 'br-date', date), field('Cycle', 'br-cycle', cycle),
      field('Territory at stake', 'br-area', area, true),
      field('Attacker', 'br-att', att), field('Defender', 'br-def', def),
      field('Result', 'br-result', res, true),
      el('div', { class: 'ffield full check' }, [claim, el('label', { for: 'br-claim', text: 'Give the territory to the winner on the map' })])
    ]));
    if (formError) form.appendChild(el('p', { class: 'form-error', role: 'alert', text: formError }));
    var submit = el('button', { class: 'btn primary', type: 'submit', text: 'Add battle report' });
    var cancel = el('button', { class: 'btn', type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', function () { formOpen = false; formDraft = null; formError = ''; renderReports(); });
    form.appendChild(el('div', { class: 'row' }, [submit, cancel]));
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!f.date) { formError = 'Pick the date the battle was played.'; renderReports(); return; }
      if (f.attacker === f.defender) { formError = 'The attacker and defender must be different gangs.'; renderReports(); return; }
      var n = +f.area, target = areaByN(n);
      if (!target) { formError = 'Pick the territory that was at stake.'; renderReports(); return; }
      var b = { id: 'b' + Date.now().toString(36), date: f.date, cycle: Math.max(1, parseInt(f.cycle, 10) || 1), area: n, attacker: f.attacker, defender: f.defender, result: f.result };
      state.battles.push(b);
      var w = winnerOf(b);
      if (f.claim && w) target.owner = w;
      formOpen = false; formDraft = null; formError = '';
      changed();
    });
    return form;
  }
  function storyIcon() {
    return sv('svg', { viewBox: '0 0 24 24', width: '16', height: '16', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: 'ticon' }, [
      sv('path', { d: 'M7 4h10a2 2 0 0 1 2 2v11a3 3 0 0 0 3 3H10a3 3 0 0 1-3-3V4z' }),
      sv('path', { d: 'M7 4a3 3 0 0 0-3 3v1h3' }),
      sv('path', { d: 'M10.5 9h5M10.5 12.5h5M10.5 16h3' })
    ]);
  }
  function storyPrompt(b) {
    var a = areaByN(b.area), t = a ? TERR[a.type] : null;
    var att = gangById(b.attacker), def = gangById(b.defender), w = winnerOf(b);
    var lines = [
      'Write a short piece of Necromunda fluff: an in-universe account of one gang battle in the underhive of Hive Primus.',
      'Keep to these facts. Invent only colour (fighter names, sounds, small moments of action). Do not invent deaths, and do not change who won.',
      '- Campaign: ' + (state.title || 'Necromunda campaign') + ', campaign cycle ' + b.cycle + '.',
      '- Attacker: ' + gangName(b.attacker) + (att && att.house ? ' (' + att.house + ')' : '') + '.',
      '- Defender: ' + gangName(b.defender) + (def && def.house ? ' (' + def.house + ')' : '') + '.',
      '- Fought over: the ' + (a ? a.type : 'territory') + '.' + (t ? ' Battlefield effect there: ' + t.effect[0] + ' (' + t.effect[1] + ')' : ''),
      '- Result: ' + (w ? gangName(w) + ' won.' + (a && a.owner === w ? ' They took control of the ' + a.type + '.' : '') : 'a draw; neither gang took the territory.'),
      'Style: gritty and cinematic, past tense, third person, 140 to 190 words in 2 or 3 short paragraphs.',
      'Reply with the story only, as plain text: no title, no headings, no markdown, no bullet points.'
    ];
    return lines.join('\n');
  }
  function generateStory(b) {
    if (!sampleNS || storyBusy[b.id]) return;
    storyBusy[b.id] = true; storyMsg[b.id] = '';
    storyEdit[b.id] = true;
    if (storyDraft[b.id] == null) storyDraft[b.id] = b.story || '';
    renderReports();
    var ta = document.getElementById('story-' + b.id);
    Promise.resolve().then(function () {
      return sampleNS(storyPrompt(b), { modelTier: 'default', onText: function (o) { storyDraft[b.id] = o.text; if (ta) ta.value = o.text; } });
    }).then(function (r) {
      storyDraft[b.id] = (r && r.text || '').trim();
      storyMsg[b.id] = 'Read it over, change anything you like, then tap Keep this story.';
    }, function (err) {
      var code = err && err.code;
      if (err && err.text) storyDraft[b.id] = err.text;
      if (code === 'not_granted') { sampleNS = null; storyMsg[b.id] = 'Claude can\u2019t write stories on this page, but you can write one yourself.'; }
      else if (code === 'rate_limited') storyMsg[b.id] = 'Claude is busy right now. Try again in a minute.';
      else storyMsg[b.id] = 'Couldn\u2019t write the story. Try again.';
    }).then(function () { storyBusy[b.id] = false; renderReports(); });
  }
  function storyBlock(b) {
    var box = el('div', { class: 'story' }, [el('h4', { text: 'Battle story' })]);
    if (!storyEdit[b.id] && b.story) {
      b.story.split(/\n\s*\n/).forEach(function (p) { if (p.trim()) box.appendChild(el('p', { text: p.trim() })); });
      var edit = el('button', { class: 'btn small', type: 'button', text: 'Edit story' });
      edit.addEventListener('click', function () { storyEdit[b.id] = true; storyDraft[b.id] = b.story; storyMsg[b.id] = ''; renderReports(); });
      var kids = [edit];
      if (sampleNS) {
        var again = el('button', { class: 'btn small', type: 'button', text: 'Rewrite with Claude' });
        again.addEventListener('click', function () { generateStory(b); });
        kids.push(again);
      }
      box.appendChild(el('div', { class: 'row' }, kids));
      return box;
    }
    var ta = el('textarea', { id: 'story-' + b.id, class: 'text-input story-input', rows: '9', maxlength: '3000', 'aria-label': 'Battle story', placeholder: 'What happened? Write the tale of the battle here.' });
    ta.value = storyDraft[b.id] != null ? storyDraft[b.id] : (b.story || '');
    ta.addEventListener('input', function () { storyDraft[b.id] = ta.value; });
    if (storyBusy[b.id]) ta.readOnly = true;
    box.appendChild(ta);
    var btns = [];
    if (sampleNS) {
      var gen = el('button', { class: 'btn small primary', type: 'button', text: storyBusy[b.id] ? 'Writing\u2026' : (ta.value ? 'Rewrite with Claude' : 'Write it with Claude') });
      gen.disabled = !!storyBusy[b.id];
      gen.addEventListener('click', function () { generateStory(b); });
      btns.push(gen);
    }
    var keep = el('button', { class: 'btn small', type: 'button', text: 'Keep this story' });
    keep.disabled = !!storyBusy[b.id];
    keep.addEventListener('click', function () {
      var text = (storyDraft[b.id] != null ? storyDraft[b.id] : ta.value).trim();
      b.story = text; storyEdit[b.id] = false; storyDraft[b.id] = null; storyMsg[b.id] = '';
      changed();
    });
    btns.push(keep);
    if (b.story || storyDraft[b.id] != null) {
      var cancel = el('button', { class: 'btn small', type: 'button', text: 'Cancel' });
      cancel.disabled = !!storyBusy[b.id];
      cancel.addEventListener('click', function () { storyEdit[b.id] = false; storyDraft[b.id] = null; storyMsg[b.id] = ''; if (!b.story) storyOpen[b.id] = false; renderReports(); });
      btns.push(cancel);
    }
    box.appendChild(el('div', { class: 'row' }, btns));
    if (storyMsg[b.id]) box.appendChild(el('p', { class: 'muted story-msg', role: 'status', text: storyMsg[b.id] }));
    return box;
  }
  function td(label, kids, cls) { return el('td', { 'data-label': label, class: cls || '' }, kids); }
  function renderReports() {
    var box = refs.reports; box.textContent = '';
    var add = el('button', { class: formOpen ? 'btn small' : 'btn small primary', type: 'button', text: formOpen ? 'Close form' : 'Add battle report', 'aria-expanded': formOpen ? 'true' : 'false' });
    add.addEventListener('click', function () { formOpen = !formOpen; formError = ''; if (formOpen && !formDraft) formDraft = newDraft(); renderReports(); });
    box.appendChild(el('div', { class: 'table-head' }, [el('h2', { class: 'ph', text: 'Battle reports' }), add]));
    if (formOpen) box.appendChild(buildForm());
    var list = battlesSorted();
    if (!list.length) { box.appendChild(el('p', { class: 'muted', text: 'No battles reported yet.' })); return; }
    var tb = el('tbody');
    list.forEach(function (b) {
      var a = areaByN(b.area), w = winnerOf(b);
      var terr = el('button', { class: 'linkish', type: 'button', 'aria-label': 'Show territory ' + b.area + ' on the map' }, [a ? iconSvg(a.type, 18) : null, el('span', { text: '#' + b.area + ' ' + (a ? a.type : 'Unknown') })]);
      terr.addEventListener('click', function () { select(b.area, true); });
      var act;
      if (confirmRemove === b.id) {
        var yes = el('button', { class: 'btn small danger', type: 'button', text: 'Remove' });
        yes.addEventListener('click', function () { state.battles = state.battles.filter(function (x) { return x.id !== b.id; }); confirmRemove = null; changed(); });
        var no = el('button', { class: 'btn small', type: 'button', text: 'Keep' });
        no.addEventListener('click', function () { confirmRemove = null; renderReports(); });
        act = el('div', { class: 'row tight' }, [yes, no]);
      } else {
        act = el('button', { class: 'btn small', type: 'button', text: 'Remove', 'aria-label': 'Remove the report for ' + battleLine(b) });
        act.addEventListener('click', function () { confirmRemove = b.id; renderReports(); });
      }
      var open = !!storyOpen[b.id];
      var sbtn = el('button', { class: 'btn small story-btn' + (b.story ? ' has-story' : ''), type: 'button', 'aria-expanded': open ? 'true' : 'false', 'aria-controls': 'story-row-' + b.id,
        'aria-label': (open ? 'Hide' : 'Show') + ' the story of ' + battleLine(b) }, [storyIcon(), el('span', { text: 'Story' })]);
      sbtn.addEventListener('click', function () { storyOpen[b.id] = !open; renderReports(); });
      act = el('div', { class: 'row tight' }, [sbtn, act]);
      tb.appendChild(el('tr', { class: open ? 'is-open' : '' }, [
        td('Date', [fmtDate(b.date)], 'nowrap'),
        td('Cycle', [String(b.cycle)], 'num'),
        td('Territory', [terr], 'full-sm'),
        td('Attacker', [gangChip(b.attacker, w === b.attacker, w === b.attacker), w ? null : el('span', { class: 'draw-tag', text: 'Draw' })]),
        td('Defender', [gangChip(b.defender, w === b.defender, w === b.defender), w ? null : el('span', { class: 'draw-tag', text: 'Draw' })]),
        td('', [act], 'actions')
      ]));
      if (open) tb.appendChild(el('tr', { class: 'story-row', id: 'story-row-' + b.id }, [el('td', { colspan: '6' }, [storyBlock(b)])]));
    });
    var table = el('table', { class: 'rtable' }, [
      el('thead', null, [el('tr', null, ['Date', 'Cycle', 'Territory', 'Attacker', 'Defender', ''].map(function (h, i) { return el('th', { class: i === 1 ? 'num' : '', text: h }); }))]),
      tb
    ]);
    box.appendChild(el('div', { class: 'tablewrap' }, [table]));
  }

  function renderTable() {
    var box = refs.table; box.textContent = '';
    var allOpen = state.areas.every(function (a) { return expanded[a.n]; });
    var toggleAll = el('button', { class: 'btn small', type: 'button', text: allOpen ? 'Hide all descriptions' : 'Show all descriptions' });
    toggleAll.addEventListener('click', function () {
      state.areas.forEach(function (a) { expanded[a.n] = !allOpen; });
      renderTable();
    });
    box.appendChild(el('div', { class: 'table-head' }, [el('h2', { class: 'ph', text: 'All ' + state.areas.length + ' territories' }), toggleAll]));
    var tb = el('tbody');
    state.areas.forEach(function (a) {
      var t = TERR[a.type], owner = gangById(a.owner);
      var dot = el('i', { class: owner ? 'dot' : 'dot unclaimed' }); if (owner) dot.style.background = owner.color;
      var open = !!expanded[a.n];
      var info = el('button', { class: 'info-btn', type: 'button', 'aria-expanded': open ? 'true' : 'false', 'aria-controls': 'desc-' + a.n,
        'aria-label': (open ? 'Hide' : 'Show') + ' what ' + a.type + ' does', title: (open ? 'Hide' : 'Show') + ' description' });
      info.appendChild(infoIcon());
      info.addEventListener('click', function (e) { e.stopPropagation(); expanded[a.n] = !open; renderTable(); });
      info.addEventListener('keydown', function (e) { e.stopPropagation(); });
      var tr = el('tr', { class: (a.n === selected ? 'is-sel' : '') + (open ? ' is-open' : ''), tabindex: '0' }, [
        el('td', null, [el('span', { class: 'badge', text: String(a.n) })]),
        el('td', null, [el('div', { class: 'terr-cell' }, [
          el('div', { class: 'terr-name' }, [iconSvg(a.type, 20), el('div', null, [el('div', { text: a.type }), areaNote(a) ? el('div', { class: 'muted', style: 'font-size:13px', text: areaNote(a) }) : null])]),
          info
        ])]),
        el('td', { class: 'num', text: String(t.income) }),
        el('td', null, [el('span', { class: 'chip' }, [dot, owner ? owner.name : 'Unclaimed'])])
      ]);
      tr.addEventListener('click', function () { select(a.n, true); });
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(a.n, true); } });
      tb.appendChild(tr);
      if (open) tb.appendChild(el('tr', { class: 'info-row', id: 'desc-' + a.n }, [el('td', { colspan: '4' }, [describe(t)])]));
    });
    var table = el('table', null, [
      el('thead', null, [el('tr', null, [el('th', { text: '#' }), el('th', { text: 'Territory' }), el('th', { class: 'num', text: 'Income' }), el('th', { text: 'Controlled by' })])]),
      tb
    ]);
    box.appendChild(el('div', { class: 'tablewrap' }, [table]));
  }

  function select(n, scroll) {
    selected = n;
    renderMap(); renderDetail(); renderTable();
    if (scroll && refs.detail.getBoundingClientRect().top < 0 || (scroll && window.matchMedia('(max-width: 880px)').matches)) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      refs.detail.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function render(opts) {
    opts = opts || {};
    if (!opts.keepTitle && refs.title.value !== state.title) refs.title.value = state.title;
    renderSaveBar();
    renderMap();
    renderDetail();
    if (!opts.keepGangs) renderGangs();
    else {
      // refresh stats without rebuilding inputs (keeps typing focus)
      refs.gangs.querySelectorAll('.gang-row').forEach(function (row, i) {
        var g = state.gangs[i]; if (!g) return;
        var b = row.querySelector('.swatch'); if (b) b.setAttribute('aria-label', 'Change colour for ' + g.name);
      });
    }
    renderTable();
    renderReports();
  }

  build();
  render();
  initCapability(0);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderMap(); }); } catch (e) { /* fonts API unavailable */ }
})();
</script>
</body>
